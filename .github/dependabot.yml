version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      # codeql-action ships init/autobuild/analyze as separate action paths that
      # must run the same version; ungrouped, Dependabot bumps one and the
      # analyze job fails on a config/runtime version mismatch.
      codeql-action:
        patterns:
          - "github/codeql-action*"
